services:
  conso:
    build: .
    container_name: conso-maison
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - npm-sqllite_default
      - default

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: conso-backup
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
      - /volume1/Datas/backup-conso:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: sh
    command: -c "echo '0 3 * * * /backup.sh' | crontab - && crond -f"

networks:
  npm-sqllite_default:
    external: true
