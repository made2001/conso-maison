{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-cash-coin"></i> Configuration des couts</h2>

<div class="card bg-dark border-secondary">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                {% for key, label in meters.items() %}
                <div class="col-md-3">
                    <label class="form-label">{{ label }}</label>
                    <div class="input-group">
                        <input type="number" step="0.0001" name="price_{{ key }}" class="form-control"
                               value="{{ config_map[key].unit_price if key in config_map else '' }}" placeholder="0.00">
                        <span class="input-group-text">EUR/unite</span>
                    </div>
                </div>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-check-lg"></i> Sauvegarder</button>
        </form>
    </div>
</div>

<div class="alert alert-info mt-4">
    <i class="bi bi-info-circle"></i> Les couts sont calcules automatiquement : consommation x prix unitaire.
    Prix en EUR/m3 pour eau et gaz, en EUR/kWh pour l'electricite.
</div>
{% endblock %}
